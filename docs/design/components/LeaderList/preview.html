<!-- @dsCard group="Сводка" height=260 subtitle="Один лидер, ничья, больше трёх (свёрнуто в «+N»), длинный ник" -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>LeaderList</title>
<style>
  body { padding: var(--space-5); }
  .pv { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: var(--space-5); }
  .pv-cell { min-width: 0; padding: var(--space-4); background: var(--surface); border: 1px solid var(--line); }
  .pv-label { margin: 0; font: 500 var(--fs-xs)/16px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
</style></head>
<body>
<div class="pv" id="root"></div>
<script>
  var Q = window.QLStats, root = document.getElementById('root');
  var P = function (n) { return { steam_id: n, name: n }; };
  [['Один лидер', [P('Doom')]],
   ['Ничья — двое', [P('Anarki'), P('Doom')]],
   ['Ничья — пятеро', [P('Doom'), P('xX_Railgun_Enjoyer_From_Novosibirsk_Xx'), P('Kotofey'), P('Sever'), P('pchelka')]],
   ['Длинный ник', [P('VeryLongNicknameFromTheServer_2026')]]
  ].forEach(function (r) {
    root.appendChild(Q.h('div', { class: 'pv-cell' }, Q.h('p', { class: 'pv-label' }, r[0]), Q.LeaderList(r[1])));
  });
</script>
</body>
</html>
